name: aprendo_plus
description: "Aprendo+ — Tutor de IA offline para estudiantes de secundaria en Peru"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  sqflite_sqlcipher: ^3.4.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_gemma: 1.4.2
  crypto: ^3.0.0
  flutter_web_auth_2: ^4.1.0
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4
  test: ^1.25.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/diagnostic/
    - assets/lessons/
    - assets/images/
    - assets/models/
    - assets/curriculum/
